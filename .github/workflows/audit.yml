name: Dependency audit

# Scans the locked dependency tree for known vulnerabilities. Socket Security
# already runs per-PR; the value here is the scheduled sweep, which catches a
# CVE disclosed against an already-pinned version between pull requests.
on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
  schedule:
    # Mondays at 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Export locked dependencies
        run: uv export --frozen --no-emit-project --format requirements-txt > requirements.txt

      - name: Audit for known vulnerabilities
        run: uvx pip-audit -r requirements.txt --strict
